project_id = "koyas-supermarket"

# Customer verification uses email only. Mirror these Auth settings in the
# hosted project before launch; migrations do not change hosted Auth settings.
[auth]
site_url = "https://koya-s-market.faazlance.workers.dev"
additional_redirect_urls = [
  "https://koya-s-market.faazlance.workers.dev/",
  "https://koya-s-market.faazlance.workers.dev/login"
]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Your Koya Stores verification code"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.magic_link]
subject = "Your Koya Stores verification code"
content_path = "./supabase/templates/email-code.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.create-razorpay-order]
verify_jwt = true

[functions.verify-razorpay-payment]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false

[functions.send-order-notifications]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
