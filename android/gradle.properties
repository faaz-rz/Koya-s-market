org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.47+ supports AGP 9's built-in Kotlin compiler. The legacy Kotlin
# Gradle plugin is deliberately not applied in settings.gradle.kts or app.
android.builtInKotlin=true
# Flutter plugins still use compatibility shims for some legacy AGP DSL types.
# Re-evaluate this flag before migrating to AGP 10.
android.newDsl=false
