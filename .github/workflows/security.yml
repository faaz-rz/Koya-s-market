name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the project Flutter version
        id: sdk
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/web/image_optimization_browser_test.dart
      - name: Confirm an unconfigured release is rejected
        run: |
          if flutter build apk --release > release-gate.log 2>&1; then
            echo "An unconfigured release build unexpectedly succeeded."
            exit 1
          fi
          grep -q "Release signing is required" release-gate.log

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify backend handlers without external messages
        run: node --test tool/account_deletion_handler_test.mjs tool/http_protocol_test.mjs tool/push_dispatch_handler_test.mjs tool/product_image_review_test.mjs tool/usage_budget_test.mjs
      - name: Verify migrations and checkout transactions on disposable PostgreSQL
        run: |
          export KOYAS_PG_RUNTIME="$(mktemp -d)"
          npm install --prefix "$KOYAS_PG_RUNTIME" --ignore-scripts --no-audit --no-fund embedded-postgres@17.10.0-beta.17 pg@8.23.0
          (
            cd "$KOYAS_PG_RUNTIME/node_modules/@embedded-postgres/linux-x64"
            if [[ -f scripts/hydrate-symlinks.js ]]; then
              node scripts/hydrate-symlinks.js
            fi
          )
          node tool/test_concurrent_transactions.mjs --performance

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
