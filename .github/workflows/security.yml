name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify push dispatch without external messages
        run: node --test tool/push_dispatch_handler_test.mjs
      - name: Confirm an unconfigured release is rejected
        run: |
          if flutter build apk --release > release-gate.log 2>&1; then
            echo "An unconfigured release build unexpectedly succeeded."
            exit 1
          fi
          grep -q "Release signing is required" release-gate.log

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
